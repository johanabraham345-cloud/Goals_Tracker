<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goals Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="bg-[#050505] text-zinc-300 min-h-screen">
    <div class="w-full max-w-[1400px] mx-auto px-10 py-12">
        <!-- Main Header -->
        <header class="flex justify-between items-start mb-16">
            <div>
                <h1 class="text-6xl font-extrabold text-white tracking-tighter mb-4">Goals Tracker</h1>
                <p id="currentDay" class="text-blue-500 text-xl font-bold uppercase tracking-[0.2em]">Tuesday, May 5</p>
            </div>
            
            <div class="flex flex-col items-center">
                <div class="relative flex items-center justify-center mb-4">
                    <svg class="w-28 h-28 transform -rotate-90">
                        <circle cx="56" cy="56" r="50" stroke="currentColor" stroke-width="5" fill="transparent" class="text-zinc-900" />
                        <circle id="globalProgressRing" cx="56" cy="56" r="50" stroke="currentColor" stroke-width="5" fill="transparent" 
                            stroke-dasharray="314.15" stroke-dashoffset="314.15" class="text-blue-500 transition-all duration-1000 ease-in-out" />
                    </svg>
                    <span id="globalPercent" class="absolute text-2xl font-black text-white">0%</span>
                </div>
                <!-- Bigger Motivation -->
                <p id="motivationText" class="text-zinc-300 text-base italic text-center max-w-[240px] leading-relaxed font-semibold">"Execution is everything."</p>
            </div>
        </header>

        <!-- Quick Add (Wide Style) -->
        <div class="mb-12">
            <form id="goalForm" class="relative max-w-2xl group">
                <input type="text" id="goalName" placeholder="Define next objective..." required 
                    class="w-full bg-zinc-900/40 border border-zinc-800/50 rounded-2xl py-6 pl-8 pr-48 outline-none focus:border-blue-500/40 focus:bg-zinc-900/80 transition-all text-lg text-white">
                <div class="absolute right-3 top-3 bottom-3 flex gap-2">
                    <input type="number" id="goalTime" placeholder="Mins" required class="w-24 bg-zinc-800/60 border-none rounded-xl px-2 text-sm text-center outline-none text-white font-bold">
                    <button type="submit" class="bg-white text-black hover:bg-zinc-200 px-8 rounded-xl text-xs font-black uppercase tracking-wider transition-transform active:scale-95">Add</button>
                </div>
            </form>
        </div>

        <!-- Task Grid (Flows left-to-right, then wraps down) -->
        <div id="goalsContainer" class="flex flex-wrap gap-4 items-start">
            <!-- Tasks appear here -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
