<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goals Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="bg-[#050505] text-zinc-300 min-h-screen">
    <div class="max-w-xl mx-auto px-6 py-12">
        <!-- Dashboard Header -->
        <header class="flex justify-between items-start mb-12">
            <div>
                <h1 class="text-5xl font-extrabold text-white tracking-tighter mb-4">Goals Tracker</h1>
                <p id="currentDay" class="text-blue-500 text-lg font-bold uppercase tracking-[0.2em]">Tuesday, May 5</p>
            </div>
            
            <div class="flex flex-col items-center">
                <div class="relative flex items-center justify-center mb-3">
                    <svg class="w-24 h-24 transform -rotate-90">
                        <circle cx="48" cy="48" r="42" stroke="currentColor" stroke-width="4" fill="transparent" class="text-zinc-900" />
                        <circle id="globalProgressRing" cx="48" cy="48" r="42" stroke="currentColor" stroke-width="4" fill="transparent" 
                            stroke-dasharray="263.9" stroke-dashoffset="263.9" class="text-blue-500 transition-all duration-1000 ease-in-out" />
                    </svg>
                    <span id="globalPercent" class="absolute text-xl font-black text-white">0%</span>
                </div>
                <p id="motivationText" class="text-zinc-400 text-sm italic text-center max-w-[200px] leading-relaxed font-medium">"Focus is a superpower."</p>
            </div>
        </header>

        <!-- Quick Add -->
        <div class="mb-10">
            <form id="goalForm" class="relative group">
                <input type="text" id="goalName" placeholder="Define objective..." required 
                    class="w-full bg-zinc-900/40 border border-zinc-800/50 rounded-2xl py-5 pl-6 pr-40 outline-none focus:border-blue-500/40 focus:bg-zinc-900/80 transition-all text-base text-white">
                <div class="absolute right-2 top-2 bottom-2 flex gap-1">
                    <input type="number" id="goalTime" placeholder="Mins" required class="w-20 bg-zinc-800/50 border-none rounded-xl px-2 text-sm text-center outline-none text-white font-bold">
                    <button type="submit" class="bg-white text-black hover:bg-zinc-200 px-6 rounded-xl text-xs font-black uppercase tracking-wider transition-transform active:scale-95">Add</button>
                </div>
            </form>
        </div>

        <!-- Task Vertical Stack -->
        <div id="goalsContainer" class="space-y-3">
            <!-- Back to original compact block size -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
