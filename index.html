<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Pulse // Goals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="bg-[#050505] text-zinc-300 min-h-screen">
    <div class="max-w-lg mx-auto px-6 py-10">
        <!-- Dashboard Header -->
        <header class="flex justify-between items-start mb-10">
            <div>
                <h2 id="currentDay" class="text-zinc-500 text-xs font-bold uppercase tracking-[0.2em] mb-1">Monday, May 5</h2>
                <h1 class="text-3xl font-extrabold text-white tracking-tight">Daily Pulse</h1>
            </div>
            <div class="relative flex items-center justify-center">
                <svg class="w-14 h-14 transform -rotate-90">
                    <circle cx="28" cy="28" r="24" stroke="currentColor" stroke-width="4" fill="transparent" class="text-zinc-800" />
                    <circle id="globalProgressRing" cx="28" cy="28" r="24" stroke="currentColor" stroke-width="4" fill="transparent" 
                        stroke-dasharray="150.8" stroke-dashoffset="150.8" class="text-blue-500 transition-all duration-700 ease-out" />
                </svg>
                <span id="globalPercent" class="absolute text-[10px] font-black text-white">0%</span>
            </div>
        </header>

        <!-- Input Section -->
        <div class="mb-8 group">
            <form id="goalForm" class="relative">
                <input type="text" id="goalName" placeholder="Add a new task..." required 
                    class="w-full bg-zinc-900/50 border border-zinc-800 rounded-2xl py-4 pl-5 pr-32 outline-none focus:border-blue-500/50 focus:bg-zinc-900 transition-all text-sm">
                <div class="absolute right-2 top-2 bottom-2 flex gap-1">
                    <input type="number" id="goalTime" placeholder="Mins" required class="w-16 bg-zinc-800 border-none rounded-xl px-2 text-xs text-center outline-none">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-4 rounded-xl text-[10px] font-bold uppercase tracking-wider">Add</button>
                </div>
            </form>
        </div>

        <!-- Task Column -->
        <div id="goalsContainer" class="space-y-2"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
